name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run deps:cycles
      - run: npm run deps:unused
      - run: npm test
      - name: API types match the pinned OpenAPI contract
        run: npm run api:types && git diff --exit-code src/shared/api/schema.gen.ts
      - run: npm run build
      - name: Production image builds
        run: docker build -t aero-zenith-flow-frontend:ci .
